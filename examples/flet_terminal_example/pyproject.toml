[project]
name = "flet-terminal-example"
version = "0.4.0"
description = "Cross-Platform Demo & Example app for flet-terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet-terminal",
    "flet",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
]

[tool.flet]
org = "ng.kiri"
product = "Flet Terminal"
build_number = 1

[tool.flet.app]
path = "src"

# Local development resolves the checkout in place. CI builds do NOT use this:
# workflows pre-build the wheel and let `flet build` resolve it via
# PIP_FIND_LINKS=wheels/ (the house example pattern).
[tool.uv.sources]
flet-terminal = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
