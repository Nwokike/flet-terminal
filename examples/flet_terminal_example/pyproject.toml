[project]
name = "flet-terminal-example"
version = "0.4.2"
description = "Cross-Platform Demo & Example app for flet-terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet-terminal",
    "flet",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
]

[tool.flet]
org = "ng.kiri"
product = "Flet Terminal"
build_number = 1

[tool.flet.app]
path = "src"

# APK size (verified 2026-10-17 by diffing against the M0-spike APKs):
# WITHOUT this, the build template ships native libs UNCOMPRESSED
# (extractNativeLibs=false semantics) — libapp.so/libflutter.so/libpython...
# all STORED = +24 MB APK for the same code. The M0 spike (which sets
# legacy_packaging=true) is 27.7 MB where this example was 55 MB with the
# same deps. With it, libs DEFLATE (extracted at install — a slightly larger
# on-disk install, a much smaller download). Apps that don't exec native
# payloads can still set it purely for download size.
[tool.flet.android]
legacy_packaging = true
split_per_abi = true

# Local development resolves the checkout in place. CI builds do NOT use this:
# workflows pre-build the wheel and let `flet build` resolve it via
# PIP_FIND_LINKS=wheels/ (the house example pattern).
[tool.uv.sources]
flet-terminal = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
