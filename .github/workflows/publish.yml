name: Publish to PyPI

on:
  # Releases are created by build-all.yml using GITHUB_TOKEN, and GitHub
  # does not let GITHUB_TOKEN-created events trigger other workflows —
  # so publishing never fired from `release:` and needed a manual dispatch
  # every time. Tag pushes fire this directly instead.
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/flet-terminal
    
    # Required for PyPI Trusted Publisher authentication
    permissions:
      id-token: write
      contents: read
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync Dart/pubspec version with pyproject
        run: python .github/scripts/sync_versions.py

      - name: Check whether this version is already on PyPI
        id: pypi_check
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sf "https://pypi.org/pypi/flet-terminal/${VERSION}/json" > /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "flet-terminal ${VERSION} is already on PyPI — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distributions
        if: steps.pypi_check.outputs.already_published != 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.pypi_check.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
